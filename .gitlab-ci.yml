# GitLab CI/CD Pipeline for CarbonXS GUI
# This pipeline automatically runs tests on every push and merge request

image: python:3.11

stages:
  - test

# Cache uv packages to speed up pipeline
cache:
  paths:
    - .cache/uv

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

before_script:
  - apt-get update && apt-get -y install libgl1
  - echo "Setting up Python environment with uv..."
  - pip install uv
  - uv pip install --system -r requirements.txt

# Run Python tests
test:
  stage: test
  script:
    - echo "Running pytest tests..."
    # Run all tests, pytest will automatically skip deprecated tests marked with @pytest.mark.skip
    # and conditionally skip tests that require Fortran reference data if unavailable
    - pytest tests/ -v --tb=short --junitxml=report.xml
  only:
    - branches
    - merge_requests
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml
    expire_in: 1 week
  allow_failure: false

